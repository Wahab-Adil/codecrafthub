# ==========================================================================
#  CodeCraftHub configuration
#  Every line here is a "key=value" pair that Spring Boot reads at startup.
# ==========================================================================

spring.application.name=CodeCraftHub

# The embedded Tomcat server listens on this port: http://localhost:8080
server.port=8080

# --------------------------------------------------------------------------
# Our JSON "database"
# --------------------------------------------------------------------------
# Path of the text file that stores all courses. It is relative to the folder
# you start the app from, so running `mvn spring-boot:run` inside the project
# creates ./courses.json right next to pom.xml.
# The file is created automatically on first start if it does not exist yet.
# Override it without editing this file, e.g.:
#   mvn spring-boot:run -Dspring-boot.run.arguments=--codecrafthub.storage.file=/tmp/demo.json
codecrafthub.storage.file=courses.json

# --------------------------------------------------------------------------
# JSON formatting (Jackson)
# --------------------------------------------------------------------------
# Use snake_case in JSON, so the Java field `targetDate` becomes
# "target_date" on the wire and in courses.json (matching the API spec).
spring.jackson.property-naming-strategy=SNAKE_CASE

# Pretty-print JSON with indentation. Nicer to read while learning;
# turn it off in a real production API to save bandwidth.
spring.jackson.serialization.indent-output=true

# --------------------------------------------------------------------------
# Logging
# --------------------------------------------------------------------------
# INFO for the web layer prints a helpful startup line listing the endpoints
# that were mapped, which is a great way to double-check your API surface.
logging.level.org.springframework.web=INFO
